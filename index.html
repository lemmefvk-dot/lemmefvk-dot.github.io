<body>

<div id="os" aria-label="StaticOS desktop"></div>

<div id="too-small" class="hidden">
  <div class="ts__card">
    <div class="ts__logo"></div>
    <b>StaticOS needs a wider screen</b>
    <small>This is a desktop shell — windows, a dock and a widget rail. Rotate your device or open it on a screen at least 900px wide.</small>
    <button class="btn btn--primary" id="ts-anyway">Continue anyway</button>
  </div>
</div>

<noscript>
  <div style="padding:40px;font-family:system-ui;color:#eee">
    <h1>StaticOS</h1>
    <p>This shell is built entirely in JavaScript. Please enable it.</p>
  </div>
</noscript>

<!-- Boot watchdog. A plain script, so it runs even when StaticOS's own
     modules cannot. If start-up throws and stalls, or the shell has not come
     up within 30 s, it replaces the blank page with a way out: reload, repair (drop
     the proxy's service worker and caches), or reset saved data. main.js
     marks progress on window.__staticBoot. -->
<script>
(function () {
  var B = window.__staticBoot = { alive: false, ok: false, shown: false, errors: [] };
  function el(tag, css, text) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (text) e.textContent = text; return e; }
  function repair(resetData) {
    var jobs = [];
    try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
    try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    /* only the person this tab is signed in as (js/core/profiles.js names
       their keys): staticos.state.v3, or staticos.state.v3::<id> */
    var mine = 'staticos.state.v3', who = null;
    try { who = JSON.parse(sessionStorage.getItem('staticos.profile') || 'null'); } catch (e) {}
    try {
      if (who && who.guest) mine = null;
      else if (who && /^p[a-z0-9]{8}$/.test(who.id)) mine += '::' + who.id;
      else if (!(who && who.id === 'default') && localStorage.getItem('staticos.profiles.v1')) mine = null;
    } catch (e) {}
    try { sessionStorage.clear(); } catch (e) {}
    /* frozen: a page that got far enough to save must not write it straight back */
    if (resetData && mine) { B.frozen = true; try { localStorage.removeItem(mine); } catch (e) {} }
    Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?repaired=' + Date.now()); });
  }
  B.recover = function (why) {
    if (B.shown || B.ok) return;
    B.shown = true;
    var btn = 'margin:6px;padding:9px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:#231419;color:#fff;font:600 13px system-ui,sans-serif;cursor:pointer';
    var box = el('div', 'position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#0b0708;color:#e8dfe3;font:14px/1.5 system-ui,sans-serif;padding:20px');
    box.id = 'boot-recover';
    var card = el('div', 'max-width:460px;text-align:center');
    card.appendChild(el('div', 'font-size:20px;font-weight:700;margin-bottom:8px', "StaticOS didn't start"));
    card.appendChild(el('div', 'color:#a99ba1;margin-bottom:14px', 'Something broke while it was loading. Repair clears the proxy\'s saved worker and caches, which fixes most of these. Your settings stay.'));
    if (why) card.appendChild(el('code', 'display:block;font-size:12px;color:#7d7379;margin-bottom:14px;word-break:break-word', String(why).slice(0, 300)));
    var again = el('button', btn, 'Try again'); again.onclick = function () { location.reload(); };
    var fix = el('button', btn + ';background:#ff456d;color:#2a0310;border-color:transparent', 'Repair and reload'); fix.onclick = function () { repair(false); };
    var wipe = el('button', btn, 'Reset StaticOS'); wipe.onclick = function () { if (confirm('Reset StaticOS? Your settings, accounts and saved state on this browser are erased.')) repair(true); };
    card.appendChild(again); card.appendChild(fix); card.appendChild(wipe);
    box.appendChild(card);
    (document.body || document.documentElement).appendChild(box);
  };
  /* an error only counts if start-up then stalls — a harmless one (a single
     app, a widget) must not cover a desktop that is coming up fine */
  function onErr(msg) {
    if (B.alive) return;
    B.errors.push(msg);
    setTimeout(function () { if (!B.alive) B.recover(msg); }, 4000);
  }
  window.addEventListener('error', function (e) {
    if (typeof ErrorEvent !== 'undefined' && e instanceof ErrorEvent) return onErr(e.message || 'a script error');
    var t = e && e.target;                       /* images and styles failing are not fatal */
    if (t && t.tagName === 'SCRIPT') onErr('could not load ' + (t.src || 'a script'));
  }, true);
  window.addEventListener('unhandledrejection', function (e) { onErr('start-up failed: ' + ((e && e.reason && e.reason.message) || e.reason)); });
  /* slow school or café Wi-Fi can take a while — give it room */
  setTimeout(function () { if (!B.alive) B.recover(B.errors[0] || 'The desktop did not come up within 30 seconds.'); }, 30000);
  /* if it does come up after all, get out of the way */
  var watch = setInterval(function () {
    if (!B.alive) return;
    clearInterval(watch);
    var box = document.getElementById('boot-recover');
    if (box) box.remove();
  }, 1000);
})();
</script>
<script type="module" src="js/main.js?v=ps5-home-v3"></script>
</body>
</html>
